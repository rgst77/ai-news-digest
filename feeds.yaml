# RSS sources for the AI news digest
# Each source is an independent node in the "fan-out": all are read in parallel
# and then combined (merge) into a single digest.
#
# category is used only to group the final digest.

feeds:
  - name: "arXiv cs.AI"
    url: "https://rss.arxiv.org/rss/cs.AI"
    category: "Investigación (papers)"

  - name: "OpenAI News"
    url: "https://openai.com/news/rss.xml"
    category: "Anuncios de labs"

  - name: "Google DeepMind News"
    url: "https://deepmind.google/blog/rss.xml"
    category: "Anuncios de labs"

  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    category: "Prensa / agregadores"

# Note: Anthropic doesn't publish a public RSS feed at anthropic.com/news
# (checked: anthropic.com/rss.xml returns 404). If they publish one in the future,
# add it here. In the meantime it can be covered manually or via separate web scraping.
