<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agentic AI News logo">
  <title>Agentic AI News</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="220" rx="18" fill="#0a0a0f"/>

  <!-- agent-network mark, centered -->
  <g stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.9">
    <line x1="320" y1="50" x2="296" y2="96"/>
    <line x1="320" y1="50" x2="344" y2="96"/>
    <line x1="296" y1="96" x2="344" y2="96"/>
  </g>
  <circle cx="320" cy="50" r="8" fill="url(#accent)"/>
  <circle cx="296" cy="96" r="8" fill="url(#accent)"/>
  <circle cx="344" cy="96" r="8" fill="url(#accent)"/>

  <text xml:space="preserve" x="320" y="150" text-anchor="middle"
        font-family="Arial Black, Helvetica Neue, sans-serif"
        font-weight="900"
        font-size="46">
    <tspan fill="#f5f5f7">AGENTIC </tspan><tspan fill="url(#accent)">AI</tspan><tspan fill="#f5f5f7"> NEWS</tspan>
  </text>

  <text x="320" y="180" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-weight="700"
        font-size="13"
        letter-spacing="3.5"
        fill="#84848c">
    DAILY SIGNAL FROM THE AI FRONTIER
  </text>
</svg>
